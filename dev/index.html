<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#eef1f8" />
    <link rel="manifest" href="/dev/manifest.webmanifest" />
    <link rel="icon" href="/dev/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/dev/icons/icon-192.png" />
    <title>Rope Tangle</title>
    <style>html,body{touch-action:none;-webkit-user-select:none;user-select:none;background:#eef1f8;height:100%;margin:0;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}[hidden]{display:none!important}#bar{z-index:2;background:#fff;align-items:center;gap:8px;height:48px;padding:0 10px;display:flex;position:fixed;top:0;left:0;right:0;box-shadow:0 1px 4px #0002}#bar button,#bar select{background:#f7f7f7;border:1px solid #bbb;border-radius:8px;padding:5px 9px;font-size:15px}#moves{color:#333;text-align:right;min-width:2ch;margin-left:auto;font-size:16px}#board{display:block;position:fixed;top:48px;left:0}#overlay{text-align:center;z-index:3;background:#fff;border-radius:14px;flex-direction:column;align-items:center;gap:12px;padding:18px 26px;font-size:20px;display:flex;position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);box-shadow:0 4px 20px #0003}#overlay button{background:#f7f7f7;border:1px solid #bbb;border-radius:10px;padding:6px 18px;font-size:18px}dialog{border:none;border-radius:14px;padding:18px;font-size:16px;box-shadow:0 4px 20px #0003}dialog label,dialog button{margin:8px 0;font-size:16px;display:block}#toast{color:#fff;pointer-events:none;z-index:4;background:#333d;border-radius:12px;padding:10px 18px;font-size:16px;position:fixed;bottom:32px;left:50%;transform:translate(-50%)}#deploy-id{color:#0007;pointer-events:none;z-index:1;font-size:11px;position:fixed;bottom:4px;right:6px}#dump{width:min(80vw,520px);height:160px;font:11px monospace}</style>
    <script type="module" crossorigin src="/dev/assets/main-s2jIcGuL.js"></script>
    <link rel="modulepreload" crossorigin href="/dev/assets/settle-DfiqZoq8.js">
  </head>
  <body>
    <header id="bar">
      <select id="ropes" aria-label="Ropes"></select>
      <button id="new">New</button>
      <span id="moves"></span>
      <button id="settings-button" aria-label="Settings">⚙︎</button>
    </header>
    <canvas id="board"></canvas>
    <div id="overlay" hidden></div>
    <div id="toast" hidden></div>
    <dialog id="settings">
      <label><input type="checkbox" id="show-moves" /> Show moves</label>
      <button id="show-dump">Debug info</button>
      <textarea id="dump" readonly hidden></textarea>
      <button id="close-settings">Close</button>
    </dialog>
  </body>
</html>
